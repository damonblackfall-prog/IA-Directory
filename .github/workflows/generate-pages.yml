name: Générer pages outils

on:
  push:
    paths:
      - 'data/tools.json'
      - 'outil/template.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install fs-extra handlebars

      - name: Générer les pages HTML
        run: node generate-tools.js

      - name: Commit et push HTML généré
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outil/*.html
          git commit -m "Pages outils générées automatiquement" || echo "Rien à committer"
          git push
