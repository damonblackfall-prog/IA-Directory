<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie IA</title>

<style>
:root{
  --primary:#007bff;
  --bg:#f4f6f9;
}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:var(--bg);
}

/* ===== FILTRES ===== */

.filter-menu{
  text-align:center;
  padding:15px;
}

.filter-menu button{
  margin:5px;
  padding:8px 14px;
  border:none;
  border-radius:20px;
  background:#e0e0e0;
  cursor:pointer;
  font-weight:bold;
}

.filter-menu button.active,
.filter-menu button:hover{
  background:var(--primary);
  color:white;
}

/* ===== GALERIE ===== */

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:15px;
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.gallery-item{
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  border:1px solid #ddd;
}

.gallery-item img,
.gallery-item video{
  width:100%;
  height:250px;
  object-fit:cover;
  display:block;
}

.gallery-item audio{
  width:100%;
}

/* ===== LIGHTBOX ===== */

.lightbox{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:1000;
}

.lightbox-content img,
.lightbox-content video{
  max-width:90%;
  max-height:75vh;
  border-radius:12px;
}

.lightbox-content audio{
  width:300px;
}

.close{
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:white;
  cursor:pointer;
}

.prompt-box{
  margin-top:15px;
  color:white;
  text-align:center;
  max-width:600px;
}

.tool-link{
  margin-top:10px;
  background:var(--primary);
  color:white;
  padding:8px 18px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
}

.copy-btn{
  margin-top:8px;
  padding:6px 12px;
  border-radius:6px;
  border:1px solid white;
  background:transparent;
  color:white;
  cursor:pointer;
}

.copy-btn:hover{
  background:white;
  color:black;
}
</style>
</head>

<body>

<h1 style="text-align:center;">Galerie IA</h1>

<!-- FILTRES -->
<div class="filter-menu">
  <button class="active" onclick="filterGallery('all',this)">Tout</button>
  <button onclick="filterGallery('image',this)">Images</button>
  <button onclick="filterGallery('video',this)">Vidéos</button>
  <button onclick="filterGallery('audio',this)">Musique</button>
</div>

<!-- GALERIE -->
<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  <div class="lightbox-content" id="lightbox-content"></div>

  <div class="prompt-box">
    <p id="prompt-text"></p>
    <button class="copy-btn" onclick="copyPrompt()">Copier le prompt</button>
    <br>
    <a id="tool-link" target="_blank" class="tool-link"></a>
  </div>
</div>

<script>

let allData = [];
let filteredData = [];
let currentIndex = 0;

/* ===== CHARGEMENT JSON ===== */

fetch('image/galerie/items/galerie.json')
.then(res => res.json())
.then(data=>{
  allData = data;
  filteredData = data;
  displayGallery(data);
})
.catch(err=>console.error("Erreur JSON:",err));


/* ===== AFFICHAGE ===== */

function displayGallery(data){

const gallery=document.getElementById("gallery");
gallery.innerHTML="";

data.forEach((item,index)=>{

const div=document.createElement("div");
div.className="gallery-item";

let media;

if(item.type==="image"){
  media=document.createElement("img");
  media.src="image/galerie/items/"+item.file;
}

else if(item.type==="video"){
  media=document.createElement("video");
  media.src="image/galerie/items/"+item.file;
  media.controls=true;
}

else if(item.type==="audio"){
  media=document.createElement("audio");
  media.src="image/galerie/items/"+item.file;
  media.controls=true;
}

div.appendChild(media);
div.onclick=()=>openLightbox(index);
gallery.appendChild(div);

});

}


/* ===== FILTRE ===== */

function filterGallery(type,btn){

document.querySelectorAll(".filter-menu button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

if(type==="all"){
  filteredData=allData;
}else{
  filteredData=allData.filter(item=>item.type===type);
}

displayGallery(filteredData);

}


/* ===== LIGHTBOX ===== */

function openLightbox(index){

currentIndex=index;

const item=filteredData[index];
const content=document.getElementById("lightbox-content");

content.innerHTML="";

let media;

if(item.type==="image"){
  media=document.createElement("img");
}

else if(item.type==="video"){
  media=document.createElement("video");
  media.controls=true;
  media.autoplay=true;
}

else if(item.type==="audio"){
  media=document.createElement("audio");
  media.controls=true;
  media.autoplay=true;
}

media.src="image/galerie/items/"+item.file;

content.appendChild(media);

document.getElementById("prompt-text").textContent=item.prompt||"";
document.getElementById("tool-link").textContent="Créer avec "+item.tool;
document.getElementById("tool-link").href=item.url;

document.getElementById("lightbox").style.display="flex";
document.body.style.overflow="hidden";

}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
document.body.style.overflow="auto";
}


/* ===== COPIER PROMPT ===== */

function copyPrompt(){
const text=document.getElementById("prompt-text").textContent;
navigator.clipboard.writeText(text);
alert("Prompt copié !");
}

</script>

</body>
</html>
