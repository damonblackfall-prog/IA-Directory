<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie IA - IA-DIRECTORY</title>
  <link rel="canonical" href="https://ia-directory.github.io/galerie/" />
  <meta name="description" content="Découvrez les meilleures créations générées par intelligence artificielle.">
  
<style>
  :root { --primary: #007bff; --dark: #000; --white: #fff; --gray: #f9f9f9; }
  
  body.modal-open { overflow: hidden; }

  body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--gray); }
  .back-link { display: inline-block; margin: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
  h1 { text-align:center; margin-top: 10px; color: #333; }
  .subtitle { text-align:center; color:#666; margin-bottom:20px; }

  .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px; max-width: 1200px; margin:auto; padding: 20px;
  }
  .gallery img {
    width:100%; height: 250px; object-fit: cover;
    cursor:pointer; border-radius:12px; transition: 0.3s; border: 1px solid #ddd;
  }
  .gallery img:hover { transform: scale(1.03); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }

  .lightbox {
    display: none; 
    position: fixed;
    z-index: 1000;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.95);
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 80vh;
    object-fit: contain;
    transition: transform 0.2s ease-out; /* Transition fluide pour le drag */
    cursor: zoom-in;
    user-select: none;
    will-change: transform;
  }
  
  .prompt-box {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%); z-index: 1100;
    background: rgba(0,0,0,0.6); padding: 12px 18px;
    border-radius: 12px; backdrop-filter: blur(8px);
    text-align: center; width: 85%; max-width: 500px;
  }

  #prompt-text { color: #fff; font-style: italic; margin-bottom: 12px; font-size: 0.9rem; line-height: 1.4; }
  
  .tool-link {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%); z-index: 1100;
    background: var(--primary); color: #fff; padding: 10px 20px;
    border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 0.9rem;
  }

  .copy-btn {
    background: transparent; border: 1px solid #fff; color: #fff;
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem;
  }
  .copy-btn:hover { background: #fff; color: #000; }

  .close { position: fixed; top: 20px; right: 25px; font-size: 40px; color: #fff; text-decoration: none; z-index: 1200; opacity: 0.8; }
  .close:hover { opacity: 1; }
.filter-menu{
text-align:center;
margin-top:10px;
margin-bottom:10px;
}

.filter-menu button{
margin:5px;
padding:8px 14px;
border:none;
border-radius:20px;
background:#eee;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

.filter-menu button:hover{
background:#007bff;
color:white;
}

.filter-menu button.active{
background:#007bff;
color:white;
    }
</style>
 
</head>
<body>

  <div class="filter-menu">

<button class="active" onclick="filterGallery('all',this)">Tout</button>

<button onclick="filterGallery('image',this)">🖼 Images</button>

<button onclick="filterGallery('video',this)">🎬 Vidéos</button>

<button onclick="filterGallery('audio',this)">🎵 Musique</button>

<button onclick="filterGallery('3d',this)">🧊 3D</button>

<button onclick="filterGallery('animation',this)">✨ Animation</button>

<button onclick="filterGallery('art',this)">🎨 Art</button>

<button onclick="filterGallery('portrait',this)">👤 Portrait</button>

<button onclick="filterGallery('background',this)">🌄 Background</button>

  </div>

<a href="../" class="back-link">← Retour à l'accueil</a>
<h1>Galerie IA</h1>
<p class="subtitle">Double-cliquez pour zoomer. Glissez pour explorer.</p>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <a href="javascript:void(0)" class="close" onclick="closeLightbox()">&times;</a>
  <img id="lightbox-img" src="" alt="">
  <div class="prompt-box">
    <p id="prompt-text"></p>
    <button class="copy-btn" onclick="copyPrompt()">📋 Copier le prompt</button>
  </div>
  <a id="tool-link" href="#" target="_blank" class="tool-link"></a>
</div>

<script>

let imagesData = [];
let filteredData = [];
let currentIndex = 0;

let startX = 0;
let zoomed = false;
let isDragging = false;
let lastX = 0, lastY = 0;
let translateX = 0, translateY = 0;


/* =====================
   CHARGEMENT JSON
===================== */

fetch('../image/galerie/items/galerie.json')
.then(res => res.json())
.then(data => {

imagesData = data;
filteredData = data;

displayGallery(filteredData);

})
.catch(error => console.error("Erreur JSON :", error));



/* =====================
   AFFICHAGE GALERIE
===================== */

function displayGallery(data){

const gallery = document.getElementById("gallery");

gallery.innerHTML = "";

data.forEach((item,index)=>{

const container = document.createElement("div");

container.className = "gallery-item";

let media;

if(item.type === "image"){

media = document.createElement("img");

media.src = "../image/galerie/items/" + item.file;

}

else if(item.type === "video"){

media = document.createElement("video");

media.src = "../image/galerie/items/" + item.file;

media.controls = true;

}

else if(item.type === "audio"){

media = document.createElement("audio");

media.src = "../image/galerie/items/" + item.file;

media.controls = true;

}

media.loading = "lazy";

container.appendChild(media);

container.onclick = () => openLightbox(index);

gallery.appendChild(container);

});

}



/* =====================
   FILTRES
===================== */

function filterGallery(type,btn){

const buttons = document.querySelectorAll(".filter-menu button");

buttons.forEach(b => b.classList.remove("active"));

btn.classList.add("active");

if(type === "all"){

filteredData = imagesData;

}else{

filteredData = imagesData.filter(item => item.type === type);

}

displayGallery(filteredData);

}



/* =====================
   LIGHTBOX
===================== */

function openLightbox(index){

currentIndex = index;

resetZoomState();

const item = filteredData[index];

const content = document.getElementById("lightbox-img");

const lb = document.getElementById("lightbox");

lb.style.display = "flex";

document.body.classList.add("modal-open");


if(item.type === "image"){

content.src = "../image/galerie/items/" + item.file;

content.style.display = "block";

}

document.getElementById("prompt-text").textContent = item.prompt || "Pas de prompt";

document.getElementById("tool-link").textContent = "Créer avec " + item.tool;

document.getElementById("tool-link").href = item.url;

setupZoom();

}



function closeLightbox(){

document.getElementById("lightbox").style.display = "none";

document.body.classList.remove("modal-open");

resetZoomState();

}



/* =====================
   ZOOM IMAGE
===================== */

function resetZoomState(){

zoomed = false;

isDragging = false;

translateX = 0;

translateY = 0;

const img = document.getElementById("lightbox-img");

img.style.transition = "transform 0.25s ease";

img.style.transform = "scale(1) translate(0px,0px)";

img.style.cursor = "zoom-in";

}



function updateTransform(){

const img = document.getElementById("lightbox-img");

if(zoomed){

const limitX = img.offsetWidth / 2;

const limitY = img.offsetHeight / 2;

translateX = Math.max(-limitX, Math.min(limitX, translateX));

translateY = Math.max(-limitY, Math.min(limitY, translateY));

img.style.transform = `scale(2) translate(${translateX/2}px,${translateY/2}px)`;

}else{

img.style.transform = "scale(1)";

}

}



function setupZoom(){

const img = document.getElementById("lightbox-img");

if(img.dataset.zoomReady) return;

img.dataset.zoomReady = "true";


img.addEventListener("dblclick",()=>{

zoomed = !zoomed;

translateX = 0;

translateY = 0;

img.style.cursor = zoomed ? "grab" : "zoom-in";

updateTransform();

});


img.addEventListener("mousedown",e=>{

if(!zoomed) return;

isDragging = true;

img.style.transition = "none";

lastX = e.clientX;

lastY = e.clientY;

img.style.cursor = "grabbing";

});


window.addEventListener("mousemove",e=>{

if(!zoomed || !isDragging) return;

translateX += e.clientX - lastX;

translateY += e.clientY - lastY;

lastX = e.clientX;

lastY = e.clientY;

updateTransform();

});


window.addEventListener("mouseup",()=>{

isDragging = false;

});


}



/* =====================
   NAVIGATION
===================== */

function showNext(){

currentIndex = (currentIndex + 1) % filteredData.length;

openLightbox(currentIndex);

}

function showPrev(){

currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;

openLightbox(currentIndex);

}



/* =====================
   SWIPE MOBILE
===================== */

const lightbox = document.getElementById("lightbox");

lightbox.addEventListener("touchstart",e=>{

startX = e.touches[0].clientX;

},{passive:true});


lightbox.addEventListener("touchend",e=>{

if(zoomed) return;

const diff = startX - e.changedTouches[0].clientX;

if(Math.abs(diff) > 70){

diff > 0 ? showNext() : showPrev();

}

},{passive:true});



/* =====================
   COPIER PROMPT
===================== */

function copyPrompt(){

const text = document.getElementById("prompt-text").textContent;

navigator.clipboard.writeText(text).then(()=>{

const btn = document.querySelector(".copy-btn");

btn.textContent = "✅ Copié !";

setTimeout(()=>{

btn.textContent = "📋 Copier le prompt";

},2000);

});

}

</script>
</body>
  </html>
