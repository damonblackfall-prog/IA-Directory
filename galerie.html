<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie IA - IA-DIRECTORY</title>
<style>
:root { --primary:#007bff; --dark:#000; --white:#fff; --gray:#f9f9f9; }
body.modal-open { overflow:hidden; }
body { font-family:'Segoe UI', Tahoma, sans-serif; margin:0; background:var(--gray); }
.back-link { display:inline-block; margin:20px; color:var(--primary); text-decoration:none; font-weight:bold; }
h1 { text-align:center; margin-top:10px; color:#333; }
.subtitle { text-align:center; color:#666; margin-bottom:20px; }

/* Filter Menu */
.filter-menu { text-align:center; margin-bottom:15px; }
.filter-menu button { margin:0 5px; padding:8px 15px; border:none; border-radius:20px; background:var(--primary); color:#fff; cursor:pointer; font-weight:bold; transition:0.3s; }
.filter-menu button:hover, .filter-menu button.active { background:#0056b3; }

/* Gallery Grid */
.gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:15px; max-width:1200px; margin:auto; padding:20px; }
.gallery-item { border-radius:12px; overflow:hidden; background:#fff; border:1px solid #ddd; cursor:pointer; position:relative; }
.gallery-item img, .gallery-item video, .gallery-item audio { width:100%; display:block; }
.gallery-item img:hover, .gallery-item video:hover { transform:scale(1.03); transition:0.3s; }

/* Lightbox */
.lightbox { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:1000; align-items:center; justify-content:center; overflow:hidden; }
.lightbox-content { max-width:90%; max-height:80vh; text-align:center; color:#fff; }
.lightbox img, .lightbox video, .lightbox audio { max-width:100%; max-height:80vh; border-radius:12px; }
.close { position:fixed; top:20px; right:25px; font-size:40px; color:#fff; text-decoration:none; z-index:1200; opacity:0.8; }
.close:hover { opacity:1; }

/* Prompt Box */
.prompt-box { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); z-index:1100; background:rgba(0,0,0,0.6); padding:12px 18px; border-radius:12px; backdrop-filter:blur(8px); width:85%; max-width:500px; text-align:center; }
#prompt-text { color:#fff; font-style:italic; font-size:0.9rem; line-height:1.4; margin-bottom:12px; }
.copy-btn { background:transparent; border:1px solid #fff; color:#fff; padding:5px 12px; border-radius:4px; cursor:pointer; font-size:0.85rem; }
.copy-btn:hover { background:#fff; color:#000; }

/* Tool Link */
.tool-link { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:1100; background:var(--primary); color:#fff; padding:10px 20px; border-radius:30px; text-decoration:none; font-weight:bold; font-size:0.9rem; }
</style>
</head>
<body>

<a href="../" class="back-link">← Retour à l'accueil</a>
<h1>Galerie IA</h1>
<p class="subtitle">Cliquez pour ouvrir, double-cliquez pour zoomer. Glissez pour explorer.</p>

<div class="filter-menu">
  <button class="active" onclick="filterGallery('all')">Tout</button>
  <button onclick="filterGallery('image')">Images</button>
  <button onclick="filterGallery('video')">Vidéos</button>
  <button onclick="filterGallery('audio')">Musique</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <a href="javascript:void(0)" class="close" onclick="closeLightbox()">&times;</a>
  <div class="lightbox-content" id="lightbox-content"></div>
  <div class="prompt-box">
    <p id="prompt-text"></p>
    <button class="copy-btn" onclick="copyPrompt()">📋 Copier le prompt</button>
  </div>
  <a id="tool-link" href="#" target="_blank" class="tool-link"></a>
</div>

<script>
let imagesData = [];
let currentIndex = 0;

// Chargement JSON
fetch('../image/galerie/items/galerie.json')
.then(res => res.json())
.then(data => {
  imagesData = data;
  displayGallery(data);
});

// Affichage galerie
function displayGallery(data) {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  data.forEach((item,index) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.dataset.index = index;
    div.dataset.type = item.type;

    let media;
    if(item.type === 'image'){
      media = document.createElement('img');
      media.src = '../image/galerie/items/'+item.file;
      media.alt = item.prompt || '';
    } else if(item.type === 'video'){
      media = document.createElement('video');
      media.src = '../image/galerie/items/'+item.file;
      media.controls = true;
    } else if(item.type === 'audio'){
      media = document.createElement('audio');
      media.src = '../image/galerie/items/'+item.file;
      media.controls = true;
    }

    div.appendChild(media);
    div.onclick = ()=>openLightbox(index);
    gallery.appendChild(div);
  });
}

// Filtrer galerie
function filterGallery(type){
  const buttons = document.querySelectorAll('.filter-menu button');
  buttons.forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  const filtered = type==='all' ? imagesData : imagesData.filter(i=>i.type===type);
  displayGallery(filtered);
}

// Lightbox
function openLightbox(index){
  currentIndex=index;
  const item = imagesData[index];
  const content = document.getElementById('lightbox-content');
  content.innerHTML='';

  let media;
  if(item.type==='image'){
    media=document.createElement('img');
    media.src='../image/galerie/items/'+item.file;
  } else if(item.type==='video'){
    media=document.createElement('video');
    media.src='../image/galerie/items/'+item.file;
    media.controls=true;
    media.autoplay=true;
  } else if(item.type==='audio'){
    media=document.createElement('audio');
    media.src='../image/galerie/items/'+item.file;
    media.controls=true;
    media.autoplay=true;
  }

  content.appendChild(media);
  document.getElementById('prompt-text').textContent=item.prompt || 'Pas de prompt';
  const toolLink=document.getElementById('tool-link');
  toolLink.textContent="Créer avec "+item.tool;
  toolLink.href=item.url;

  document.getElementById('lightbox').style.display='flex';
  document.body.classList.add('modal-open');
}

function closeLightbox(){
  document.getElementById('lightbox').style.display='none';
  document.body.classList.remove('modal-open');
}

// Copier prompt
function copyPrompt(){
  const text=document.getElementById('prompt-text').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelector('.copy-btn');
    btn.textContent="✅ Copié !";
    setTimeout(()=>{btn.textContent="📋 Copier le prompt";},2000);
  });
}
</script>
</body>
</html>
