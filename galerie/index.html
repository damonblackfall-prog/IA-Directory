<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie IA - IA-DIRECTORY</title>
  <link rel="canonical" href="https://ia-directory.github.io/galerie/" />
  <meta name="description" content="Découvrez les meilleures créations générées par intelligence artificielle. Prompts inclus pour Midjourney, DALL-E 3 et plus.">
  
  <meta property="og:title" content="Galerie IA - IA-DIRECTORY">
  <meta property="og:description" content="Explorez l'art de l'IA et copiez les meilleurs prompts.">
  <meta property="og:url" content="https://ia-directory.github.io/galerie/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://ia-directory.github.io/image/galerie/items/neon-cyber-city.jpg">
<style>
  :root { --primary: #007bff; --dark: #000; --white: #fff; --gray: #f9f9f9; }
  .back-link { display: inline-block; margin: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--gray); }
  h1 { text-align:center; margin-top: 10px; color: #333; }
  .subtitle { text-align:center; color:#666; margin-bottom:20px; }

  .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px; max-width: 1200px; margin:auto; padding: 20px;
  }
  .gallery img {
    width:100%; height: 250px; object-fit: cover;
    cursor:pointer; border-radius:12px; transition: 0.3s; border: 1px solid #ddd;
  }
  .gallery img:hover { transform: scale(1.03); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }

  .lightbox {
  .lightbox img {
  max-width: 100%;
  max-height: 90vh;        /* image presque plein écran */
  object-fit: contain;
  transition: transform 0.25s ease;
  touch-action: none;      /* nécessaire pour le drag tactile */
  cursor: zoom-in;
  user-select: none;       /* empêche la sélection de texte */
  display: block;
  margin: 0 auto;
}
  
  .prompt-box {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1100;
  background: rgba(0,0,0,0.55);
  padding: 12px 18px;
  border-radius: 12px;
  backdrop-filter: blur(6px);
}

.tool-link {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1100;
}

.copy-btn {
  color: #fff;
  border-color: #fff;
}

.copy-btn:hover {
  background: #fff;
  color: #000;
    }
  
  .prompt-box { margin-top: 20px; text-align: center; max-width: 600px; }
  #prompt-text { color: #fff; font-style: italic; margin-bottom: 12px; font-size: 1rem; line-height: 1.5; }
  .copy-btn {
    background: transparent; border: 1px solid var(--primary); color: var(--primary);
    padding: 6px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s;
  }
  .copy-btn:hover { background: var(--primary); color: #fff; }

  .tool-link { margin-top: 20px; background: var(--primary); color: #fff; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: bold; }
  .close { position: fixed; top: 20px; right: 30px; font-size: 40px; color: #fff; text-decoration: none; }
</style>
</head>
<body>

<a href="../" class="back-link">← Retour à l'accueil</a>

<h1>Galerie IA</h1>
<p class="subtitle">Cliquez sur une œuvre pour copier son prompt et découvrir l'outil.</p>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <a href="javascript:void(0)" class="close" onclick="closeLightbox()">&times;</a>
  <img id="lightbox-img" src="" alt="">
  <div class="prompt-box">
    <p id="prompt-text"></p>
    <button class="copy-btn" onclick="copyPrompt()">📋 Copier le prompt</button>
  </div>
  <a id="tool-link" href="#" target="_blank" class="tool-link"></a>
</div>

<script>
let imagesData = [];
let currentIndex = 0;
let startX = 0;
let zoomed = false;
let isDragging = false;
let lastX = 0;
let lastY = 0;
let translateX = 0;
let translateY = 0;

/* 📦 Chargement des images */
fetch('../image/galerie/items/galerie.json')
  .then(res => res.json())
  .then(images => {
    imagesData = images;
    const gallery = document.getElementById('gallery');

    images.forEach((imgData, index) => {
      const img = document.createElement('img');
      img.src = '../image/galerie/items/' + imgData.file;
      img.alt = "Œuvre générée par " + imgData.tool;
      img.onclick = () => openLightbox(index);
      gallery.appendChild(img);
    });
  });

/* 🖼️ Ouvrir lightbox */
function openLightbox(index) {
  currentIndex = index;
  zoomed = false;
  translateX = 0;
  translateY = 0;

  const imgData = imagesData[index];
  const img = document.getElementById('lightbox-img');

  document.getElementById('lightbox').style.display = 'flex';
  img.src = '../image/galerie/items/' + imgData.file;
  img.style.transform = 'scale(1)';
  img.style.cursor = 'zoom-in';

  document.getElementById('prompt-text').textContent =
    imgData.prompt || "Pas de prompt disponible";

  document.getElementById('tool-link').textContent =
    "Créer avec " + imgData.tool;
  document.getElementById('tool-link').href = imgData.url;

  setupZoom();
}

/* ❌ Fermeture */
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}

/* 🔄 Navigation */
function showNext() {
  currentIndex = (currentIndex + 1) % imagesData.length;
  openLightbox(currentIndex);
}

function showPrev() {
  currentIndex = (currentIndex - 1 + imagesData.length) % imagesData.length;
  openLightbox(currentIndex);
}

/* 👆 Swipe mobile */
const lightbox = document.getElementById('lightbox');

lightbox.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener('touchend', e => {
  if (zoomed) return; // 🚫 pas de swipe quand zoomé
  const endX = e.changedTouches[0].clientX;
  const diff = startX - endX;
  if (Math.abs(diff) > 50) diff > 0 ? showNext() : showPrev();
});

/* 🔍 Zoom + Drag (mobile & desktop) */
function setupZoom() {
  const img = document.getElementById('lightbox-img');
  if (img.dataset.zoomReady) return;
  img.dataset.zoomReady = "true";

  // Double clic / double tap
  img.addEventListener('dblclick', () => {
    zoomed = !zoomed;
    translateX = 0;
    translateY = 0;

    if (zoomed) {
      img.style.transform = `scale(2) translate(0px, 0px)`;
      img.style.cursor = 'grab';
    } else {
      img.style.transform = 'scale(1)';
      img.style.cursor = 'zoom-in';
    }
  });

  // Drag desktop
  img.addEventListener('mousedown', e => {
    if (!zoomed) return;
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    img.style.cursor = 'grabbing';
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    if (zoomed) img.style.cursor = 'grab';
  });

  window.addEventListener('mousemove', e => {
    if (!zoomed || !isDragging) return;

    translateX += e.clientX - lastX;
    translateY += e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    img.style.transform = `scale(2) translate(${translateX}px, ${translateY}px)`;
  });

  // Drag tactile
  img.addEventListener('touchstart', e => {
    if (!zoomed) return;
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  });

  img.addEventListener('touchmove', e => {
    if (!zoomed || !isDragging) return;
    e.preventDefault();

    translateX += e.touches[0].clientX - lastX;
    translateY += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;

    img.style.transform = `scale(2) translate(${translateX}px, ${translateY}px)`;
  }, { passive: false });

  img.addEventListener('touchend', () => {
    isDragging = false;
  });
}

/*  Copier le prompt */
function copyPrompt() {
  const text = document.getElementById('prompt-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = "✅ Copié !";
    setTimeout(() => {
      btn.textContent = " Copier le prompt";
    }, 2000);
  });
}
</script>

</body>
</html>
