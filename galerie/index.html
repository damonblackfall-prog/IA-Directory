<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie IA Multimédia</title>
<style>
  :root { --primary: #007bff; --dark: #111; --white: #fff; --gray: #f4f4f4; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--gray); }
  body.modal-open { overflow: hidden; }
  
  .back-link { display: inline-block; margin: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
  h1 { text-align:center; color: #333; }
  .subtitle { text-align:center; color:#666; margin-bottom:20px; }

  /* Grille */
  .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px; max-width: 1200px; margin:auto; padding: 20px;
  }
  .item-container { 
    position: relative; height: 250px; cursor: pointer; 
    border-radius: 12px; overflow: hidden; border: 1px solid #ddd; transition: 0.3s;
  }
  .item-container:hover { transform: scale(1.03); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
  
  .media-thumb { width: 100%; height: 100%; object-fit: cover; }
  
  /* Icônes pour différencier les types */
  .badge {
    position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6);
    color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; pointer-events: none;
  }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; z-index: 1000; top: 0; left: 0;
    width: 100%; height: 100%; background: rgba(0,0,0,0.95);
    align-items: center; justify-content: center; flex-direction: column;
  }

  .lightbox-content { max-width: 90%; max-height: 70vh; outline: none; }
  
  /* Spécifique Audio en Lightbox */
  .audio-player-container { 
    background: #222; padding: 40px; border-radius: 20px; text-align: center; width: 80%; max-width: 400px; 
  }

  .prompt-box {
    margin-top: 20px; background: rgba(255,255,255,0.1); padding: 15px;
    border-radius: 12px; backdrop-filter: blur(8px); text-align: center; width: 85%; max-width: 500px;
  }
  #prompt-text { color: #fff; font-style: italic; font-size: 0.9rem; }
  
  .tool-link {
    margin-top: 15px; background: var(--primary); color: #fff; padding: 10px 20px;
    border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 0.9rem;
  }

  .copy-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
  .close { position: fixed; top: 20px; right: 25px; font-size: 40px; color: #fff; cursor: pointer; z-index: 1200; }
</style>
</head>
<body>

<a href="../" class="back-link">← Retour</a>
<h1>Galerie IA Multimédia</h1>
<p class="subtitle">Images, Vidéos et Créations Audio</p>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <span class="close" onclick="closeLightbox()">&times;</span>
  
  <div id="media-container" style="display: flex; justify-content: center; align-items: center; width: 100%;">
    </div>

  <div class="prompt-box">
    <p id="prompt-text"></p>
    <button class="copy-btn" onclick="copyPrompt()">📋 Copier le prompt</button>
  </div>
  <a id="tool-link" href="#" target="_blank" class="tool-link"></a>
</div>

<script>
let itemsData = [];
let currentIndex = 0;
const basePath = '../image/galerie/items/';

fetch(basePath + 'galerie.json')
  .then(res => res.json())
  .then(data => {
    itemsData = data;
    const gallery = document.getElementById('gallery');
    data.forEach((item, index) => {
      const container = document.createElement('div');
      container.className = 'item-container';
      container.onclick = () => openLightbox(index);

      // Création de la miniature
      let thumb;
      if(item.type === 'video') {
        thumb = document.createElement('video'); // Utilise la 1ère image de la vidéo
        thumb.src = basePath + item.file + "#t=0.1"; 
        container.innerHTML += `<span class="badge">🎬 Vidéo</span>`;
      } else if(item.type === 'audio') {
        thumb = document.createElement('img');
        thumb.src = "https://cdn-icons-png.flaticon.com/512/3039/3039411.png"; // Icône audio par défaut
        thumb.style.padding = "20px"; thumb.style.boxSizing = "border-box"; thumb.style.background = "#333";
        container.innerHTML += `<span class="badge">🎵 Audio</span>`;
      } else {
        thumb = document.createElement('img');
        thumb.src = basePath + item.file;
      }
      
      thumb.className = 'media-thumb';
      container.appendChild(thumb);
      gallery.appendChild(container);
    });
  });

function openLightbox(index) {
  currentIndex = index;
  const item = itemsData[index];
  const container = document.getElementById('media-container');
  const lb = document.getElementById('lightbox');
  
  container.innerHTML = ''; // Nettoyer
  lb.style.display = 'flex';
  document.body.classList.add('modal-open');

  // Injection selon le type
  if(item.type === 'video') {
    const video = document.createElement('video');
    video.src = basePath + item.file;
    video.controls = true;
    video.autoplay = true;
    video.className = 'lightbox-content';
    container.appendChild(video);
  } else if(item.type === 'audio') {
    const audioDiv = document.createElement('div');
    audioDiv.className = 'audio-player-container';
    audioDiv.innerHTML = `<h3 style="color:white">Lecteur Audio</h3>
                          <audio controls autoplay src="${basePath + item.file}" style="width:100%"></audio>`;
    container.appendChild(audioDiv);
  } else {
    const img = document.createElement('img');
    img.src = basePath + item.file;
    img.className = 'lightbox-content';
    container.appendChild(img);
  }

  document.getElementById('prompt-text').textContent = item.prompt || "Pas de prompt";
  document.getElementById('tool-link').textContent = "Créer avec " + item.tool;
  document.getElementById('tool-link').href = item.url;
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('media-container').innerHTML = ''; // Arrête la musique/vidéo
  document.body.classList.remove('modal-open');
}

function copyPrompt() {
  const text = document.getElementById('prompt-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = "✅ Copié !";
    setTimeout(() => { btn.textContent = "📋 Copier le prompt"; }, 2000);
  });
}

// Navigation clavier
document.addEventListener('keydown', (e) => {
  if (document.getElementById('lightbox').style.display === 'flex') {
    if (e.key === "ArrowRight") currentIndex = (currentIndex + 1) % itemsData.length, openLightbox(currentIndex);
    if (e.key === "ArrowLeft") currentIndex = (currentIndex - 1 + itemsData.length) % itemsData.length, openLightbox(currentIndex);
    if (e.key === "Escape") closeLightbox();
  }
});
</script>
</body>
</html>
